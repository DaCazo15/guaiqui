[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Site URL principal de la plataforma (Producción en Vercel)
site_url = "https://guaiqui.vercel.app"
# Redirect URLs autorizadas para redirección de OAuth, confirmación de correo y entornos local/producción
additional_redirect_urls = [
  "https://guaiqui.vercel.app/**",       # Producción Web (Nuxt)
  "https://guaiqui.vercel.app/confirm",   # Callback confirmación y OAuth PKCE producción
  "http://localhost:3000/**",             # Local Web (Nuxt)
  "http://localhost:3001/**",             # Local Admin alternativo
  "http://localhost:3010/**"              # Local Admin (Vite port por defecto en apps/admin)
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Password security requirements
[auth.password]
min_length = 8

# Rate limits to prevent email spam / brute force (en un entorno con SMTP propio el límite email_sent aplica por hora)
[auth.rate_limit]
email_sent = 30  # Límite por hora de correos de autenticación

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Configuración de servidor SMTP propio (Resend)
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SMTP_PASS)"
admin_email = "onboarding@resend.dev"
sender_name = "Guaiqueríes de Margarita"

# Plantillas de correo que utilizan {{ .ConfirmationURL }}
[auth.email.template.confirmation]
subject = "Confirma tu correo electrónico — Guaiqueríes de Margarita"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña — Guaiqueríes de Margarita"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

